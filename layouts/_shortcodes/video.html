{{- $src := .Get "src" | default (.Get 0) -}}
<div class="video-wrapper">
  <video controls src="{{ $src }}"{{ with .Get "poster" }} poster="{{ . }}"{{ end }}{{ if eq (.Get "autoplay") "true" }} autoplay{{ end }}{{ if eq (.Get "muted") "true" }} muted{{ end }}>
    <p>Your browser doesn't support HTML5 video. <a href="{{ $src }}">Download the video</a>.</p>
  </video>
</div>
